# Recommended AMDockVS environment: the compiled scientific stack from conda-forge, then
# AMDockVS from PyPI, which adds what is pip-only (PySide6, the pymol-open-source 3.2 wheels
# and the MolSuite packages).
#
#   micromamba create -n amdockvs -f environment.yml    # or: conda env create -f environment.yml
#
# Keep pip last: never `conda install` into this environment afterwards (conda would lay its
# own builds over pip's); recreate it instead.
name: amdockvs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit>=2025.3.5
  - gemmi>=0.6
  - numpy>=2.0
  - scipy>=1.15
  - pandas>=2.3.1
  - pyarrow>=15
  - vina>=1.2.7
  # ms_adtools and dimorphite-dl come from pip with AMDockVS: conda-forge's dimorphite-dl caps
  # rdkit below 2026.
  - loguru>=0.7.2  # dimorphite-dl
  - biopython>=1.86
  - sqlalchemy>=2.0
  - sqlmodel>=0.0.24
  - pydantic>=2.0
  - pyqtgraph>=0.13
  - zstandard>=0.22
  - loky>=3.0
  - blinker>=1.6
  - toml>=0.10
  - joblib>=1.3
  - tqdm>=4.66
  - pip
  - pip:
      - amdockvs
