# Installed and looked up by ms_env (format documented there).
[tool]
name = "adgpu"
label = "AutoDock-GPU"
purpose = "AutoDock4 force field and genetic search on the GPU; accepts custom parameters."
footprint = "~11 MB (one OpenCL binary; needs a GPU driver with OpenCL)"
version = "1.6"
prefix = "{tools_home}/docking/{name}/{version}"

[locate]
paths = ["{prefix}/adgpu"]
commands = ["adgpu", "autodock_gpu_128wi", "autodock_gpu_64wi"]
check = ["{exe}", "--version"]

# The OpenCL build runs on NVIDIA, AMD and Intel drivers alike, so it is the one installed;
# the checksums pin the release assets. No Windows entry: AutoDock-GPU docks over autogrid4
# maps, and autogrid4 has no Windows build, so it could not run there anyway.
[[install]]
name = "download AutoDock-GPU 1.6"
to = "{prefix}/adgpu"
timeout = 300
download.linux-64 = { url = "https://github.com/ccsb-scripps/AutoDock-GPU/releases/download/v1.6/adgpu-v1.6_linux_x64_ocl_128wi", sha256 = "8a22804c1fde62a59c030a45e8a9d9d960ff329d22e4927daf7464df393b8047" }
download.linux-aarch64 = { url = "https://github.com/ccsb-scripps/AutoDock-GPU/releases/download/v1.6/adgpu-v1.6_linux_aarch64_ocl_128wi", sha256 = "66a7be1d0277050dc7b8d0b0f520c19fb71447a89ab34f31bbb321e0a6ea8409" }
download.osx-64 = { url = "https://github.com/ccsb-scripps/AutoDock-GPU/releases/download/v1.6/adgpu-v1.6_macos_x64_ocl_128wi", sha256 = "9d26f25908dd14c35cf6f667187738c49ba750840d6ca85ca75f6bf5c8dec779" }
download.osx-arm64 = { url = "https://github.com/ccsb-scripps/AutoDock-GPU/releases/download/v1.6/adgpu-v1.6_macos_aarch64_ocl_128wi", sha256 = "8787489e84f0e6f602cc50b5dfaab19c63744a90400521f8f31cf4d800cd8519" }
