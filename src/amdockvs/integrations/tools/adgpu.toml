# Installed and looked up by ms_flow.core.executor.tools (format documented there).
[tool]
name = "adgpu"
label = "AutoDock-GPU"
purpose = "AutoDock4 force field and genetic search on the GPU; accepts custom parameters."
footprint = "~11 MB (one Linux x86-64 OpenCL binary; needs a GPU driver with OpenCL)"
version = "1.6"
prefix = "{tools_home}/docking/{name}/{version}"

[locate]
paths = ["{prefix}/adgpu"]
commands = ["adgpu", "autodock_gpu_128wi", "autodock_gpu_64wi"]
check = ["{exe}", "--version"]

# The OpenCL build runs on NVIDIA, AMD and Intel drivers alike, so it is the one installed;
# the checksum pins the release asset.
[[install]]
name = "download AutoDock-GPU 1.6"
argv = ["sh", "-c", "mkdir -p \"$0\" && curl -fsSL -o \"$0/adgpu\" https://github.com/ccsb-scripps/AutoDock-GPU/releases/download/v1.6/adgpu-v1.6_linux_x64_ocl_128wi && echo \"8a22804c1fde62a59c030a45e8a9d9d960ff329d22e4927daf7464df393b8047  $0/adgpu\" | sha256sum -c - && chmod +x \"$0/adgpu\"", "{prefix}"]
timeout = 300
