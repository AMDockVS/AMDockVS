# Installed and looked up by ms_env (format documented there).
# Ketcher is a web app: what is "located" is its index.html, and the editor runs its folder.
[tool]
name = "ketcher"
label = "Ketcher"
purpose = "2D molecule editor for small molecules (Edit… on Molecules and Ligands)."
footprint = "~60 MB (Ketcher standalone web build)"
version = "3.18.0"
prefix = "{tools_home}/editors/{name}/{version}"

[locate]
paths = ["{prefix}/index.html"]

[[install]]
name = "download Ketcher 3.18.0"
to = "{prefix}"
timeout = 600
download = { url = "https://github.com/epam/ketcher/releases/download/v3.18.0/ketcher-standalone-3.18.0.zip", sha256 = "484e7f10a0e74808ae5f43f0e6448db6f4d884bdd2189aa271108474167a3e7e" }
