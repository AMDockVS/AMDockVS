# Installed and looked up by ms_env (format documented there).
[tool]
name = "qvina"
label = "QuickVina 2"
purpose = "Faster Vina-compatible docking inside a known binding site."
footprint = "~35 MB (isolated conda environment)"
version = "2.1"
prefix = "{tools_home}/docking/{name}/{version}"

[locate]
paths = ["{bin}/qvina2"]
commands = ["qvina2.1", "qvina2", "qvina02"]
check = ["{exe}", "--help"]

# conda-forge builds QuickVina 2.1 for Linux, macOS and Windows alike.
[env]
conda = ["qvina=2.1.0"]
