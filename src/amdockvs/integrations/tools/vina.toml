# Installed and looked up by ms_env (format documented there).
[tool]
name = "vina"
label = "AutoDock Vina"
purpose = "The Vina program, for where its Python package has no build (Windows, macOS, ARM Linux)."
footprint = "~5 MB (one official release binary)"
version = "1.2.7"
prefix = "{tools_home}/docking/{name}/{version}"

[locate]
paths = ["{prefix}/vina"]
commands = ["vina"]
check = ["{exe}", "--version"]

# The official release binaries; the checksums pin them.
[[install]]
name = "download AutoDock Vina 1.2.7"
to = "{prefix}/vina"
timeout = 300
download.linux-64 = { url = "https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64", sha256 = "f31f774f723bba7bbe6e9d1c47577020eea9a8da16424284c043d22593570644" }
