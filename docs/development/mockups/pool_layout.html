<!DOCTYPE html>
<!-- ponytail: mockup only, no build step. Open directly in a browser. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>AMDockVS — layout [tool][pool][viz]</title>
<style>
  :root{
    --bg:#1e1f22; --panel:#2b2d30; --panel2:#26282b; --bd:#393b40;
    --fg:#dfe1e5; --fg2:#9da0a8; --accent:#3574f0; --lock:#5c6bc0;
    --row:#2b2d30; --rowalt:#252729; --sel:#2d4a77;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  .demo-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;
       background:#17181a;border-bottom:1px solid var(--bd);font-size:12px}
  .demo-bar b{color:var(--fg2);font-weight:500;margin-right:4px}
  .demo-bar button{background:var(--panel);color:var(--fg);border:1px solid var(--bd);
       border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
  .demo-bar button.on{background:var(--accent);border-color:var(--accent)}

  .shell{display:flex;height:calc(100vh - 37px)}

  /* far-left icon rail: las listas de herramientas como iconos directos */
  .rail{width:44px;background:var(--panel2);border-right:1px solid var(--bd);
        display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
  .rail div{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;
        font-size:15px;cursor:pointer;opacity:.55}
  .rail div.on{background:var(--sel);opacity:1}
  .rail .sp{height:10px;opacity:0}

  /* LEFT: tool controller */
  .tool{width:270px;background:var(--panel);border-right:1px solid var(--bd);
        display:flex;flex-direction:column}
  .hd{padding:7px 10px;border-bottom:1px solid var(--bd);font-size:11px;
      text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);
      display:flex;justify-content:space-between;align-items:center}
  .tool .body{padding:10px;overflow:auto;flex:1}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11px;color:var(--fg2);margin-bottom:3px}
  .fld select,.fld input{width:100%;background:var(--panel2);color:var(--fg);
       border:1px solid var(--bd);border-radius:4px;padding:4px 6px;font-size:12px}
  .trio{display:flex;gap:5px}
  .scope-note{background:rgba(92,107,192,.13);border:1px solid rgba(92,107,192,.4);
       border-radius:4px;padding:7px 8px;font-size:11px;color:#b6bdd8;margin-bottom:11px}
  .scope-note b{color:#c9d0ea}
  .run{width:100%;background:var(--accent);border:0;color:#fff;padding:7px;
       border-radius:4px;font-size:13px;cursor:pointer;margin-top:4px}
  .selinfo{font-size:11px;color:var(--fg2);text-align:center;margin-top:7px}

  /* CENTER: pool */
  .pool{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
  .tabs{display:flex;background:var(--panel2);border-bottom:1px solid var(--bd)}
  .tabs div{padding:6px 14px;font-size:12px;color:var(--fg2);cursor:pointer;
       border-right:1px solid var(--bd)}
  .tabs div.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
  .chips{display:flex;gap:6px;align-items:center;padding:7px 10px;
       border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);
       border:1px solid var(--bd);border-radius:11px;padding:2px 4px 2px 9px;font-size:11px}
  .chip .x{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
       cursor:pointer;color:var(--fg2);font-size:12px}
  .chip .x:hover{background:#4a4d52;color:#fff}
  .chip.locked{background:rgba(92,107,192,.16);border-color:rgba(92,107,192,.55);color:#c3caeb;
       padding-right:9px}
  .chip.locked .lk{opacity:.75;font-size:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--panel2);text-align:left;padding:6px 10px;font-weight:500;
     color:var(--fg2);border-bottom:1px solid var(--bd);font-size:11px}
  td{padding:5px 10px;border-bottom:1px solid #2f3134}
  tr:nth-child(even) td{background:var(--rowalt)}
  tr.sel td{background:var(--sel)!important}
  tr{cursor:pointer}
  .pool .foot{margin-top:auto;padding:6px 10px;border-top:1px solid var(--bd);
       font-size:11px;color:var(--fg2);display:flex;justify-content:space-between}

  /* RIGHT: visualization (intercambiable) */
  .viz{width:290px;background:var(--panel);border-left:1px solid var(--bd);
       display:flex;flex-direction:column}
  .vizbody{flex:1;display:grid;place-items:center;color:#55585e;font-size:12px;
       background:#141516;margin:8px;border-radius:5px;text-align:center;padding:12px}
  .vizswap{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--bd)}
  .vizswap span{flex:1;text-align:center;padding:4px;font-size:11px;border-radius:4px;
       background:var(--panel2);color:var(--fg2);cursor:pointer}
  .vizswap span.on{background:var(--sel);color:var(--fg)}
</style>
</head>
<body>

<div class="demo-bar">
  <b>Foco activo:</b>
  <button data-m="vina" class="on">Docking · Vina</button>
  <button data-m="pocket">Pocket Detection</button>
  <button data-m="none">Sin tool (browse)</button>
  <span style="margin-left:auto;color:#6b6e75">el tool con foco conduce el scope del pool</span>
</div>

<div class="shell">

  <div class="rail" id="rail">
    <div title="Catalog">🗂</div>
    <div title="Import">📥</div>
    <div class="sp"></div>
    <div title="Molecule Tools">⚗️</div>
    <div title="Docking" class="on">🎯</div>
    <div title="QSAR">📈</div>
    <div title="Workflows">🔀</div>
    <div class="sp"></div>
    <div title="Jobs">⚙️</div>
  </div>

  <div class="tool">
    <div class="hd"><span id="tool-title">Docking Studio</span><span style="opacity:.5">▾</span></div>
    <div class="body" id="tool-body"></div>
  </div>

  <div class="pool">
    <div class="tabs">
      <div class="on" id="tab-main">Ligands</div>
      <div>Receptors</div>
      <div>Molecules</div>
      <div style="color:#5d6068">Results ×</div>
    </div>
    <div class="chips" id="chips"></div>
    <table>
      <thead><tr><th style="width:44px">ID</th><th>Name</th><th style="width:120px">Type</th>
      <th style="width:70px">Atoms</th><th style="width:70px">MW</th><th style="width:60px">Prep</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="foot"><span id="count"></span><span>page 1 / 1 · 20 per page</span></div>
  </div>

  <div class="viz">
    <div class="hd"><span id="viz-title">PyMOL</span><span style="opacity:.5">⤢</span></div>
    <div class="vizbody" id="vizbody">estructura 3D<br><span style="font-size:11px">(vista intercambiable)</span></div>
    <div class="vizswap">
      <span class="on">PyMOL</span><span>Grid Box</span><span>Distribution</span>
    </div>
  </div>

</div>

<script>
const LIG = [
  [12,"CHEMBL25 · aspirin","small molecule",21,180.2,"✓"],
  [13,"ZINC000019632618","small molecule",34,312.4,"✓"],
  [14,"lig_hit_004","small molecule",28,265.3,"—"],
  [15,"imatinib","small molecule",68,493.6,"✓"],
  [16,"ZINC000004096546","small molecule",41,378.9,"—"],
];
const PROT = [
  [ 3,"1ATP · chain A","protein",1842,38210.0,"✓"],
  [ 4,"6LU7 · Mpro","protein",2384,33796.6,"✓"],
  [ 7,"AF-P00533-F1","protein",3140,54088.2,"—"],
];
const PEP = [
  [21,"peptide_GLP1","peptide",243,3297.7,"—"],
  [22,"cyclo_RGD","peptide",97,603.6,"✓"],
];

const MODES = {
  vina: {
    tool:"Docking Studio", tab:"Ligands",
    note:"Scope fijado por <b>Vina</b>: la tabla queda acotada a small molecules mientras este tool tenga el foco.",
    locked:{f:"molecule_type", v:"small molecule"},
    free:[["usage_class","general"],["excluded","false"]],
    rows:LIG, sel:[1,3],
    fields:`
      <div class="fld"><label>Engine</label><select><option>Vina</option><option>Vinardo</option><option>gnina</option></select></div>
      <div class="fld"><label>Receptor</label><select><option>6LU7 · Mpro</option></select></div>
      <div class="fld"><label>Box center (x, y, z)</label><div class="trio">
        <input value="-10.4"><input value="12.1"><input value="68.9"></div></div>
      <div class="fld"><label>Size (Å)</label><div class="trio">
        <input value="22"><input value="22"><input value="22"></div></div>
      <div class="fld"><label>Exhaustiveness</label><input value="8"></div>`
  },
  pocket: {
    tool:"Pocket Detection", tab:"Receptors",
    note:"Scope fijado por <b>Pocket Detection</b>: solo proteínas. El pool cambió de tab y de filtro por el foco.",
    locked:{f:"molecule_type", v:"protein"},
    free:[["excluded","false"]],
    rows:PROT, sel:[1],
    fields:`
      <div class="fld"><label>Method</label><select><option>fpocket</option><option>P2Rank</option></select></div>
      <div class="fld"><label>Min alpha spheres</label><input value="35"></div>
      <div class="fld"><label>Min drug score</label><input value="0.30"></div>
      <div class="fld"><label>Max pockets / receptor</label><input value="5"></div>`
  },
  none: {
    tool:"— sin tool activo —", tab:"Ligands",
    note:"Sin tool con foco el pool queda <b>sin scope impuesto</b>: se ve todo (small molecules, péptidos, proteínas) y todos los chips son removibles.",
    locked:null,
    free:[["excluded","false"]],
    rows:[...LIG,...PEP,...PROT], sel:[],
    fields:`<div style="color:#6b6e75;font-size:12px;padding:18px 4px;text-align:center;line-height:1.7">
      Ningún tool abierto.<br>El pool es un navegador libre.<br><br>
      <span style="font-size:11px">Este es el precio del diseño:<br>para ver el catálogo completo<br>hay que soltar el foco del tool.</span></div>`
  }
};

let mode = "vina";

function render(){
  const m = MODES[mode];
  document.getElementById("tool-title").textContent = m.tool;
  document.getElementById("tab-main").textContent = m.tab;
  document.getElementById("tool-body").innerHTML =
    `<div class="scope-note">${m.note}</div>` + m.fields +
    (mode==="none" ? "" :
      `<button class="run">▶ Run</button><div class="selinfo">${m.sel.length} de ${m.rows.length} seleccionados</div>`);

  const chips = [];
  if(m.locked) chips.push(
    `<span class="chip locked" title="Impuesto por el tool — no removible">
       <span class="lk">🔒</span>${m.locked.f} = ${m.locked.v}</span>`);
  m.free.forEach(([f,v])=>chips.push(
    `<span class="chip">${f} = ${v}<span class="x">×</span></span>`));
  chips.push(`<span style="color:#5d6068;font-size:11px;margin-left:4px">+ filtro</span>`);
  document.getElementById("chips").innerHTML = chips.join("");

  document.getElementById("rows").innerHTML = m.rows.map((r,i)=>
    `<tr class="${m.sel.includes(i)?'sel':''}"><td>${r[0]}</td><td>${r[1]}</td>
     <td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("");

  document.getElementById("count").textContent = `${m.rows.length} registros en scope`;
  document.getElementById("viz-title").textContent = mode==="pocket" ? "PyMOL · pockets" : "PyMOL";
  document.querySelectorAll("#rail div").forEach(d=>d.classList.remove("on"));
  const railIdx = {vina:4, pocket:3, none:0}[mode];
  document.querySelectorAll("#rail div")[railIdx].classList.add("on");
}

document.querySelectorAll(".demo-bar button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".demo-bar button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); mode=b.dataset.m; render();
});
document.getElementById("rows").onclick = e=>{
  const tr = e.target.closest("tr"); if(!tr) return;
  tr.classList.toggle("sel");
  const n = document.querySelectorAll("#rows tr.sel").length;
  const el = document.querySelector(".selinfo");
  if(el) el.textContent = `${n} de ${MODES[mode].rows.length} seleccionados`;
};
render();
</script>
</body>
</html>
